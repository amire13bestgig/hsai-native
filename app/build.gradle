plugins {
 id 'com.android.application'
 id 'org.jetbrains.kotlin.android'
 id 'org.jetbrains.kotlin.plugin.compose'
}
android {
 namespace 'ir.hsai.mobile'
 compileSdk 35
 defaultConfig { applicationId 'ir.hsai.mobile'; minSdk 29; targetSdk 35; versionCode 5; versionName '2.0.2-native'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 buildFeatures { compose true; buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
 signingConfigs {
  release {
   storeFile file('../keystore/hsai-permanent.jks')
   storePassword 'hsai2026pass'
   keyAlias 'hsai-key'
   keyPassword 'hsai2026pass'
   enableV1Signing true
   enableV2Signing true
   enableV3Signing true
  }
  debug {
   storeFile file('../keystore/hsai-permanent.jks')
   storePassword 'hsai2026pass'
   keyAlias 'hsai-key'
   keyPassword 'hsai2026pass'
   enableV1Signing true
   enableV2Signing true
   enableV3Signing true
  }
 }
 buildTypes {
  debug {
   signingConfig signingConfigs.debug
  }
  release {
   signingConfig signingConfigs.release
   minifyEnabled false
  }
 }
 testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true }
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2024.12.01')
 implementation 'androidx.activity:activity-compose:1.9.3'
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.compose.ui:ui-tooling-preview'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.material:material-icons-core'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
 implementation 'androidx.work:work-runtime-ktx:2.10.0'
 implementation 'androidx.core:core-ktx:1.15.0'
 implementation 'androidx.exifinterface:exifinterface:1.4.2'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
 debugImplementation 'androidx.compose.ui:ui-tooling'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 testImplementation 'androidx.compose.ui:ui-test-junit4'
 debugImplementation 'androidx.compose.ui:ui-test-manifest'
 testImplementation 'org.json:json:20240303'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
}

tasks.withType(Test).configureEach {
 maxHeapSize = "384m"
 // Native Robolectric extracts a large runtime; do not exhaust a RAM-backed /tmp on CI.
 def nativeTemp = layout.buildDirectory.dir("test-tmp").get().asFile
 systemProperty "java.io.tmpdir", nativeTemp.absolutePath
 doFirst { nativeTemp.mkdirs() }
}
